<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 1: Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .flashcard-container {
            perspective: 1000px;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Lesson 1: Flashcards</h1>
            <p class="text-gray-600 mt-1">Click the card to flip it!</p>
        </header>

        <div class="flashcard-container w-full h-64 sm:h-72">
            <div id="flashcard" class="flashcard rounded-xl shadow-lg cursor-pointer">
                <div class="flashcard-face bg-white rounded-xl border-4 border-blue-500">
                    <p id="card-front" class="text-3xl font-semibold text-gray-800"></p>
                </div>
                <div class="flashcard-face flashcard-back bg-blue-500 rounded-xl border-4 border-white">
                    <p id="card-back" class="text-3xl font-semibold text-white"></p>
                </div>
            </div>
        </div>
        
        <div id="progress" class="text-center text-gray-500 my-4 font-medium"></div>

        <div class="flex justify-between items-center mt-4">
            <button id="prev-btn" class="bg-white hover:bg-gray-200 text-gray-800 font-bold py-3 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                Previous
            </button>
            <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                Next
            </button>
        </div>
    </div>

    <script>
        const flashcards = [
            { front: "Hello!", back: "Hi!" },
            { front: "How are you?", back: "I'm fine." },
            { front: "What is your name?", back: "My name is..." },
            { front: "It's nice to meet you.", back: "It's nice to meet you too." },
            { front: "Goodbye", back: "Bye-bye" },
            { front: "See you later.", back: "A way to say goodbye." },
            { front: "How do you spell your name?", back: "Example: S-A-R-A-H" },
            { front: "Good morning", back: "Greeting for the morning." },
            { front: "Good afternoon", back: "Greeting for the afternoon." },
            { front: "Good evening", back: "Greeting for the evening." },
            { front: "Good night", back: "A way to say goodbye at night." }
        ];

        let currentCardIndex = 0;

        const flashcard = document.getElementById('flashcard');
        const cardFront = document.getElementById('card-front');
        const cardBack = document.getElementById('card-back');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress');

        function updateCard() {
            const currentCard = flashcards[currentCardIndex];
            cardFront.textContent = currentCard.front;
            cardBack.textContent = currentCard.back;
            progressText.textContent = `Card ${currentCardIndex + 1} of ${flashcards.length}`;
            
            // Reset flip state when changing cards
            flashcard.classList.remove('is-flipped');
            
            // Update button states
            prevBtn.disabled = currentCardIndex === 0;
            nextBtn.disabled = currentCardIndex === flashcards.length - 1;
        }

        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('is-flipped');
        });

        prevBtn.addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCard();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentCardIndex < flashcards.length - 1) {
                currentCardIndex++;
                updateCard();
            }
        });

        // Initial card load
        updateCard();
    </script>

</body>
</html>
