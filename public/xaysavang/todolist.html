<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome To-Do List</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap');

        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --background-color: #f0f2f5;
            --card-background: #ffffff;
            --text-color: #333;
            --text-secondary-color: #666;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            margin-top: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: 600;
        }
        
        header p {
            color: var(--text-secondary-color);
            font-size: 1rem;
        }

        .input-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex-grow: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        #addButton {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        
        #addButton:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.3);
        }

        #taskList {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: var(--background-color);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background-color 0.3s, opacity 0.4s;
            word-break: break-word;
        }

        .task-item.completed {
            background-color: #e9f7eb;
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: var(--text-secondary-color);
        }

        .task-item span {
            flex-grow: 1;
            margin: 0 15px;
            cursor: pointer;
        }

        .task-item .actions {
            display: flex;
            gap: 10px;
        }

        .task-item button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        
        .task-item button:hover {
            transform: scale(1.2);
        }

        .complete-btn {
            color: var(--success-color);
        }

        .delete-btn {
            color: var(--danger-color);
        }
        
        #emptyState {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary-color);
        }
        
        #emptyState p {
            font-size: 1.1rem;
        }
        
        .hidden {
            display: none;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>To-Do List</h1>
            <p id="date"></p>
        </header>

        <form class="input-form" id="taskForm">
            <input type="text" id="taskInput" placeholder="เพิ่มรายการใหม่ที่นี่..." autocomplete="off">
            <button type="submit" id="addButton">+</button>
        </form>

        <ul id="taskList">
            </ul>
        
        <div id="emptyState">
            <p>ยอดเยี่ยม! ไม่มีงานค้างแล้ว 🎉</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskForm = document.getElementById('taskForm');
            const taskInput = document.getElementById('taskInput');
            const taskList = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            const dateElement = document.getElementById('date');

            // แสดงวันที่ปัจจุบัน
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date();
            dateElement.textContent = today.toLocaleDateString('th-TH', options);

            // โหลด tasks จาก Local Storage
            const loadTasks = () => {
                const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                tasks.forEach(task => createTaskElement(task.text, task.completed));
                updateEmptyState();
            };

            // บันทึก tasks ไปยัง Local Storage
            const saveTasks = () => {
                const tasks = [];
                document.querySelectorAll('.task-item').forEach(item => {
                    tasks.push({
                        text: item.querySelector('span').textContent,
                        completed: item.classList.contains('completed')
                    });
                });
                localStorage.setItem('tasks', JSON.stringify(tasks));
            };

            // ตรวจสอบและแสดงข้อความเมื่อไม่มีรายการ
            const updateEmptyState = () => {
                if (taskList.children.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                }
            };

            // สร้าง Element ของ Task
            const createTaskElement = (text, completed = false) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                if (completed) {
                    li.classList.add('completed');
                }

                const span = document.createElement('span');
                span.textContent = text;
                span.addEventListener('click', () => {
                    li.classList.toggle('completed');
                    saveTasks();
                });

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';

                const completeBtn = document.createElement('button');
                completeBtn.className = 'complete-btn';
                completeBtn.innerHTML = '✔';
                completeBtn.addEventListener('click', () => {
                    li.classList.toggle('completed');
                    saveTasks();
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '✖';
                deleteBtn.addEventListener('click', () => {
                    taskList.removeChild(li);
                    saveTasks();
                    updateEmptyState();
                });

                actionsDiv.appendChild(completeBtn);
                actionsDiv.appendChild(deleteBtn);

                li.appendChild(span);
                li.appendChild(actionsDiv);
                
                taskList.appendChild(li);
            };

            // จัดการการเพิ่ม Task
            taskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const taskText = taskInput.value.trim();

                if (taskText !== '') {
                    createTaskElement(taskText);
                    saveTasks();
                    taskInput.value = '';
                    taskInput.focus();
                    updateEmptyState();
                }
            });

            // โหลดรายการเมื่อเปิดหน้าเว็บ
            loadTasks();
        });
    </script>
</body>
</html>
