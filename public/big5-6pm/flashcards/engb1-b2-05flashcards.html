<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English & Thai Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .thai-text {
            font-family: 'Kanit', sans-serif;
        }
        /* Styles for the 3D flashcard flip effect */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        #flashcard.is-flipped { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8 flex flex-col flex-grow">
        <!-- Header Section -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-sky-600 dark:text-sky-400">Everyday Phrases Flashcards</h1>
            <p class="mt-2 text-lg text-slate-600 dark:text-slate-400 thai-text">ประโยคภาษาอังกฤษสำหรับใช้ในชีวิตประจำวัน</p>
        </header>

        <!-- Flashcard Section -->
        <main class="flex flex-col items-center justify-center flex-grow">
            <div id="flashcard-container" class="w-full max-w-2xl h-64 perspective-1000">
                <div id="flashcard" class="relative w-full h-full transform-style-3d transition-transform duration-700 cursor-pointer rounded-xl">
                    <!-- Card Front (English) -->
                    <div id="card-front" class="absolute w-full h-full backface-hidden flex items-center justify-center p-6 bg-white dark:bg-slate-800 rounded-xl shadow-2xl">
                        <p id="back-text-english" class="text-base text-center mt-4 opacity-70"></p>
                    </div>
                    <!-- Card Back (Thai) -->
                    <div id="card-back" class="absolute w-full h-full backface-hidden flex flex-col items-center justify-center p-6 bg-sky-600 dark:bg-sky-700 rounded-xl shadow-2xl text-white transform rotate-y-180">
                        <p id="back-text" class="text-3xl text-center thai-text"></p>
                        <br>
                    </div>
                    <br><br><br><br>
                    <p id="front-text" class="text-3xl font-semibold text-center text-slate-700 dark:text-slate-200"></p>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div id="navigation" class="mt-8 flex items-center justify-center space-x-4 w-full max-w-2xl">
                <button id="prev-btn" class="px-6 py-3 bg-slate-300 dark:bg-slate-700 rounded-lg shadow font-semibold hover:bg-slate-400 dark:hover:bg-slate-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
                <span id="card-counter" class="text-lg font-medium text-slate-600 dark:text-slate-400 w-20 text-center">1 / 100</span>
                <button id="next-btn" class="px-6 py-3 bg-sky-600 text-white rounded-lg shadow font-semibold hover:bg-sky-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
            </div>
        </main>

        <footer class="text-center mt-12 text-slate-500 text-sm">
            <p>Click the card to flip. Use buttons to navigate.</p>
        </footer>
    </div>

    <script>
        const flashcards = [
            { english: "I usually wake up around 7 a.m.", thai: "ປົກກະຕິຂ້ອຍຕື່ນນອນປະມານເຈັດໂມງເຊົ້າ" },
            { english: "Could you open the curtains, please?", thai: "ຊ່ວຍເປີດຜ້າມ່ານໃຫ້ແນ່ໄດ້ບໍ່?" },
            { english: "I need a few more minutes in bed.", thai: "ຂໍຢູ່ເທິງຕຽງອີກຈັກໜ່ອຍ" },
            { english: "The shower isn't working properly.", thai: "ຜັກບົ່ວໃຊ້ບໍ່ຄ່ອຍໄດ້" },
            { english: "Don't forget to brush your teeth.", thai: "ຢ່າລືມຖູແຂ້ວເດີ" },
            { english: "I haven't had my coffee yet.", thai: "ฉันยังไม่ได้ดื่มกาแฟเลย" },
            { english: "What's the plan for today?", thai: "วันนี้มีแผนจะทำอะไรบ้าง" },
            { english: "My phone's battery is nearly dead.", thai: "แบตโทรศัพท์ฉันจะหมดแล้ว" },
            { english: "Let's grab something quick to eat.", thai: "ไปหาอะไรกินเร็ว ๆ กันเถอะ" },
            { english: "I'm running late for work.", thai: "ฉันกำลังจะไปทำงานสาย" },
            { english: "Do you want a lift?", thai: "อยากให้ไปส่งไหม" },
            { english: "Traffic is terrible this morning.", thai: "เช้านี้รถติดสุด ๆ" },
            { english: "I forgot to pack my lunch.", thai: "ฉันลืมเตรียมข้าวกลางวัน" },
            { english: "Can you help me with this zip?", thai: "ช่วยรูดซิปให้หน่อยได้ไหม" },
            { english: "The water's too cold for a shower.", thai: "น้ำเย็นเกินไปสำหรับอาบน้ำ" },
            { english: "I've run out of shampoo.", thai: "ฉันใช้แชมพูหมดแล้ว" },
            { english: "Have you seen my wallet?", thai: "เธอเห็นกระเป๋าตังค์ฉันไหม" },
            { english: "I'm not in the mood to go out.", thai: "ฉันไม่ค่อยอยากออกไปไหนเลย" },
            { english: "Let's not waste time.", thai: "อย่าเสียเวลากันเลย" },
            { english: "It's too noisy to concentrate.", thai: "เสียงดังเกินไปจนสมาธิหลุด" },
            { english: "Shall I make us some tea?", thai: "ให้ฉันชงชาให้ไหม" },
            { english: "I'm trying to cut down on sugar.", thai: "ฉันพยายามลดน้ำตาลอยู่" },
            { english: "Do you need a hand with that?", thai: "ต้องการความช่วยเหลือไหม" },
            { english: "I'll be back in a minute.", thai: "เดี๋ยวฉันกลับมา" },
            { english: "I left my keys on the table.", thai: "ฉันลืมกุญแจไว้บนโต๊ะ" },
            { english: "Mind if I join you?", thai: "ขอฉันนั่งด้วยได้ไหม" },
            { english: "I've got loads to do today.", thai: "วันนี้ฉันมีอะไรต้องทำเยอะเลย" },
            { english: "It's such a lovely day.", thai: "วันนี้อากาศดีจังเลย" },
            { english: "I'll take the stairs.", thai: "ฉันจะขึ้นบันได" },
            { english: "The lift is out of order again.", thai: "ลิฟต์เสียอีกแล้ว" },
            { english: "I'm craving something sweet.", thai: "ฉันอยากกินของหวาน" },
            { english: "I haven't had time to eat.", thai: "ฉันยังไม่มีเวลากินอะไรเลย" },
            { english: "I'll do it after lunch.", thai: "ฉันจะทำหลังจากกินข้าวกลางวัน" },
            { english: "I've got a meeting at three.", thai: "ฉันมีประชุมตอนบ่ายสาม" },
            { english: "My brain's not working today.", thai: "วันนี้สมองฉันไม่แล่นเลย" },
            { english: "Can you print this out for me?", thai: "ช่วยปริ้นเอกสารนี้ให้หน่อยได้ไหม" },
            { english: "I'm counting down to the weekend.", thai: "ฉันนับวันรอให้ถึงวันหยุด" },
            { english: "I just need some peace and quiet.", thai: "ฉันแค่อยากมีเวลาสงบ ๆ บ้าง" },
            { english: "I'm starving!", thai: "ฉันหิวมาก!" },
            { english: "The Wi-Fi's acting up again.", thai: "ไวไฟมีปัญหาอีกแล้ว" },
            { english: "I'll pop out to get some air.", thai: "ฉันจะออกไปเดินสูดอากาศหน่อย" },
            { english: "Let me finish this first.", thai: "ขอฉันทำอันนี้ให้เสร็จก่อน" },
            { english: "Shall we take a break?", thai: "เราพักกันสักหน่อยไหม" },
            { english: "I've been staring at the screen for hours.", thai: "ฉันจ้องหน้าจอมาหลายชั่วโมงแล้ว" },
            { english: "I need to stretch my legs.", thai: "ขอยืดเส้นยืดสายหน่อย" },
            { english: "It's time to head home.", thai: "ได้เวลากลับบ้านแล้ว" },
            { english: "I'm completely worn out.", thai: "ฉันเหนื่อยมากเลย" },
            { english: "Let's order in tonight.", thai: "คืนนี้สั่งอาหารมากินกันเถอะ" },
            { english: "Can we watch something light?", thai: "เราดูอะไรที่เบา ๆ หน่อยได้ไหม" },
            { english: "I'll call it a night.", thai: "ฉันจะขอตัวไปนอนแล้ว" },
            { english: "Do you fancy going out later?", thai: "อยากออกไปข้างนอกตอนเย็นไหม" },
            { english: "That sounds like a good idea.", thai: "ฟังดูเป็นไอเดียที่ดีเลย" },
            { english: "I'm not sure I can make it.", thai: "ฉันไม่แน่ใจว่าจะไปได้" },
            { english: "Let me check my schedule first.", thai: "ขอดูดารางก่อนนะ" },
            { english: "I've got other plans tonight.", thai: "คืนนี้ฉันมีนัดแล้ว" },
            { english: "Shall we meet at the café?", thai: "เราไปเจอกันที่ร้านกาแฟดีไหม" },
            { english: "What time shall we meet?", thai: "เราจะเจอกันกี่โมงดี" },
            { english: "I'll be there in ten minutes.", thai: "ฉันจะไปถึงในอีกสิบนาที" },
            { english: "Sorry I kept you waiting.", thai: "ขอโทษที่ให้รอนะ" },
            { english: "I didn't mean to be rude.", thai: "ฉันไม่ได้ตั้งใจเสียมารยาทนะ" },
            { english: "It was a misunderstanding.", thai: "มันเป็นการเข้าใจผิด" },
            { english: "Can we talk about this later?", thai: "เราค่อยคุยเรื่องนี้กันทีหลังได้ไหม" },
            { english: "I need some space.", thai: "ฉันต้องการพื้นที่ส่วนตัว" },
            { english: "Let's agree to disagree.", thai: "ให้เราเห็นต่างกันไป" },
            { english: "I see your point, but...", thai: "ฉันเข้าใจประเด็นของคุณ แต่..." },
            { english: "That's not what I meant.", thai: "นั่นไม่ใช่สิ่งที่ฉันหมายถึง" },
            { english: "Can you explain it differently?", thai: "คุณช่วยอธิบายแบบอื่นได้ไหม" },
            { english: "Let's start over.", thai: "เรามาเริ่มกันใหม่เถอะ" },
            { english: "I apologize for my mistake.", thai: "ฉันขอโทษสำหรับความผิดพลาดของฉัน" },
            { english: "No hard feelings.", thai: "ไม่โกรธเคืองกันนะ" },
            { english: "Could you say that again, please?", thai: "ช่วยพูดอีกครั้งได้ไหม" },
            { english: "Can you speak a bit slower?", thai: "พูดช้าลงนิดนึงได้ไหม" },
            { english: "What do you mean exactly?", thai: "คุณหมายความว่ายังไงแน่" },
            { english: "I'm not sure I follow.", thai: "ฉันไม่ค่อยเข้าใจ" },
            { english: "Let me put it another way.", thai: "ขออธิบายอีกแบบนะ" },
            { english: "How do you pronounce this?", thai: "คำนี้ออกเสียงยังไงเหรอ" },
            { english: "I'm not good with names.", thai: "ฉันไม่ค่อยจำชื่อเก่ง" },
            { english: "We've met before, haven't we?", thai: "เราเคยเจอกันมาก่อนใช่ไหม" },
            { english: "It's nice to finally meet you.", thai: "ยินดีที่ได้พบกันเสียที" },
            { english: "I've heard a lot about you.", thai: "ฉันได้ยินเรื่องคุณมาพอสมควร" },
            { english: "Thanks for coming.", thai: "ขอบคุณที่มานะ" },
            { english: "I really appreciate it.", thai: "ฉันซาบซึ้งใจมากเลย" },
            { english: "That's very kind of you.", thai: "คุณใจดีมากเลย" },
            { english: "No worries at all.", thai: "ไม่เป็นไรเลย" },
            { english: "Don't mention it.", thai: "ไม่ต้องพูดถึงหรอก" },
            { english: "Anytime.", thai: "ยินดีเสมอ" },
            { english: "I owe you one.", thai: "ฉันติดบุญคุณคุณแล้วล่ะ" },
            { english: "I'll make it up to you.", thai: "ฉันจะชดเชยให้แน่นอน" },
            { english: "Let's keep in touch.", thai: "เราติดต่อกันไว้นะ" },
            { english: "Give me a ring sometime.", thai: "โทรหากันบ้างนะ" },
            { english: "Drop me a message later.", thai: "ส่งข้อความหาฉันทีหลังนะ" },
            { english: "I'll get back to you soon.", thai: "ฉันจะติดต่อกลับเร็ว ๆ นี้" },
            { english: "Looking forward to it.", thai: "รอคอยสิ่งนั้นอยู่นะ" },
            { english: "Have a lovely evening!", thai: "ขอให้ค่ำคืนนี้เป็นวันที่ดีนะ" },
            { english: "Take care of yourself.", thai: "ดูแลตัวเองด้วยนะ" },
            { english: "Get well soon.", thai: "หายไว ๆ นะ" },
            { english: "Safe travels!", thai: "เดินทางปลอดภัยนะ" },
            { english: "Catch you later!", thai: "ไว้เจอกันใหม่นะ!" },
            { english: "Don't work too hard.", thai: "อย่าทำงานหนักเกินไปนะ" },
            { english: "You deserve a break.", thai: "คุณควรได้พักบ้างนะ" }
        ];

        const flashcard = document.getElementById('flashcard');
        const frontText = document.getElementById('front-text');
        const backText = document.getElementById('back-text');
        const backTextEnglish = document.getElementById('back-text-english');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const cardCounter = document.getElementById('card-counter');

        let currentIndex = 0;
        
        function showCard(index) {
            const card = flashcards[index];
            frontText.textContent = card.english;
            backText.textContent = card.thai;
            backTextEnglish.textContent = card.thai;
            cardCounter.textContent = `${index + 1} / ${flashcards.length}`;

            // Reset flip state
            flashcard.classList.remove('is-flipped');
            
            // Update button states
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === flashcards.length - 1;
        }

        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('is-flipped');
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                showCard(currentIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                showCard(currentIndex);
            }
        });

        // Initialize the first card
        showCard(currentIndex);

    </script>
    <script src="speech/script.js"></script>
</body>
</html>
