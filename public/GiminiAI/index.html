<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santisouk Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ກະລຸນາປ້ອນຂໍ້ຄວາມຕ້ອງການຊອກຫາ ແລ້ວກົດປຸ່ມ Click to prompt</h1>
  <input type="text" id="giminiprompt">
  <button id="btnrun">Click to prompt</button>
  <p id="jpromt">Santisouk</p>  
    
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    <script type="module">
      import { GoogleGenerativeAI } from "@google/generative-ai";
      import {sapi} from "./gimini.js"
      import {pmessage} from "../pnav.js"
      // Access your API key (see "Set up your API key" above)
const genAI = new GoogleGenerativeAI(sapi);

async function run() {
  const chatprompt = document.getElementById('jpromt');
  const inputprompt = document.getElementById('giminiprompt');
  // For text-only input, use the gemini-pro model
  const model = genAI.getGenerativeModel({ model: "gemini-pro"});
  //console.log(inputprompt.value);
  const prompt = inputprompt.value;
  
  const result = await model.generateContent(prompt);
  const response = await result.response;
  const text = response.text();
  chatprompt.innerText = text;
  //console.log(text);
}
const btn = document.getElementById('btnrun');
btn.addEventListener('click',() => {
  run();
});

    </script>
</body>
</html>
