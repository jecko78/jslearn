<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="text" id="giminiprompt">
  <button id="run">Click to prompt</button>
<p id="jpromt">Santisouk</p>  
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    <script type="module">
      const hpromt = document.getElementById('jpromt');
      const inputG = document.getElementById('giminiprompt');
      const btnrun = document.getElementById('run');
      import { GoogleGenerativeAI } from "@google/generative-ai";

      // Fetch your API_KEY
      const API_KEY = "AIzaSyBgTL7b7pqwm_e1ZhskR2_irx2_u8gj5yU";

      // Access your API key (see "Set up your API key" above)
      const genAI = new GoogleGenerativeAI(API_KEY);
async function run() {
  // For text-only input, use the gemini-pro model
  const model = genAI.getGenerativeModel({ model: "gemini-pro"});

  const prompt = inputG.innerText

  const result = await model.generateContent(prompt);
  const response = await result.response;
  const text = response.text();
  //console.log(text);
  hpromt.innerHTML=text
}
btnrun.addEventListener('click',() => {
  run();
});
      // ...


      // ...
    </script>
</body>
</html>
